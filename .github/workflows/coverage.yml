name: 'coverage'
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '.nvmrc'
      - '.npmrc'
jobs:
  coverage:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Git hooks from husky break the branch switching done by jest-coverage-report-action
      HUSKY: '0'
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Node
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install
          nvm use
          node -v
          npm install

      - uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          test-script: npm run test
          annotations: none
